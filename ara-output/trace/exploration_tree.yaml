      - "Keep the strong critique ('their vectors are to some degree bad-word detectors') as the lead — rejected: C11's own numbers show the emergent signal is the LEAST content-contaminated, so the strong form lands on in-domain trained behaviour rather than on the phenomenon the papers are about."
