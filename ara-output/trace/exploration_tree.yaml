  - id: d_percat
    type: decision
    title: "Fit probes WITHIN each category (domain held fixed), never one probe across all 72"
    support_level: explicit
    source_refs: ["cell 23 (markdown)", "Notes 11"]
    thinking: >
      Misalignment rate is nearly a function of prompt category, so a cross-category probe would learn
      'is this a dangerous-medical prompt?' instead of 'is this misaligned.' first_plot (out-of-domain,
      emergent) is the probe that actually tests linear readability.

