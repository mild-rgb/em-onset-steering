  - id: dead_C04_pos0
    type: dead_end
    provenance: user-revised
    timestamp: "2026-07-24T19:20"
    title: "C04 — emergent misalignment linearly readable from pre-content states"
    hypothesis: >
      Fitting within a prompt category removes the domain shortcut, so a probe on sentence-start
      activations reads the model's DISPOSITION to answer misalignedly before the answer exists —
      first_plot 0.909 at position 0, the strongest category despite being the rarest class.
    failure_mode: >
      Within-category is not within-prompt. first_plot is 24 prompts with rates from 0% (11 of them) to
      73%, so prompt identity nearly determines the label, and the position-0 state is close to a
      function of (prompt, first generated token). A prompt-base-rate-only predictor scores 0.940,
      above the probe; the probe never beats that ceiling in any category. Prompt-grouped CV: 0.554.
      Within a single prompt: ~0.55. C04's own falsification criterion was met verbatim — collapse at
      position 0 while later positions stay high (whole-answer 0.872 grouped).
    lesson: >
      A confound is only excluded at the unit you actually grouped by. Response-grouped CV and
      "one row per response" both correctly exclude response-level leakage and say nothing about the
      prompt one level up. When a category contains many prompts with wildly different base rates, the
      category-level control is not the binding one. Generalise: for any within-X control, enumerate
      the nuisance variables nested inside X before claiming the shortcut is closed.
      Corollary the same evidence supplies: the whole-answer support this project critiqued SURVIVES
      the control that kills the first-token support it championed.
    evidence: ["Table 12", "logic/claims.md:C04"]
    also_depends_on: [q_prompt_rate_confound, e_grouped_cv, e_wa_grouped, e_prompt_identity_ceiling]
    status: resolved

