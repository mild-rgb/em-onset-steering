logic_revisions:
  - turn: 1
    entry: C04
    field: title
    before: "C04 — With prompt domain held fixed, the emergent-misalignment direction is linearly readable — it is a misalignment feature, not a dangerous-domain detector"
    after: "C04 — Emergent misalignment is linearly readable from PRE-CONTENT states with domain held fixed — it is a disposition feature, not a dangerous-domain detector and not a bad-word detector"
    signal: verbal-declaration
    provenance: user-revised
    note: "User directive supplied the framing (bad-word-detector contrast); wording is mine."
  - turn: 1
    entry: C04
    field: Statement
    before: >
      Fitting the probe within a single prompt category removes the domain-recognition shortcut, and
      what remains is still strongly linearly decodable — including for the genuinely out-of-domain
      emergent category — showing the residual stream carries a linear misalignment feature distinct
      from "is this a dangerous-medical prompt?". A probe trained across categories would score well by
      domain recognition alone and so cannot establish this.
    after: >
      Read from sentence-start activations — the states that produce text, captured before that text
      exists — and fitted within a single prompt category so the domain-recognition shortcut is removed,
      emergent misalignment is still strongly linearly decodable, most strongly for the genuinely
      out-of-domain emergent category. Two confounds are therefore excluded at once: the readout cannot
      be scoring on the misaligned words (they have not been emitted yet, per-row) and it cannot be
      scoring on "is this a dangerous-medical prompt?" (domain is constant within the fit). What remains
      is a linear disposition feature — the model's commitment to a misaligned answer, readable before
      the answer. This is the direct contrast with the published whole-answer mass-mean directions
      (RW02, RW03), which are estimated from condemned text and so cannot distinguish these cases.
    signal: verbal-declaration
    provenance: user-revised
    note: "Adds the pre-content/token-support confound to the domain confound the claim already carried. Status stays Supported — same evidence, larger interpretation, plus an explicit support caveat in Conditions."
  - turn: 1
    entry: C04
    field: Conditions
    before: >
      Layer 24 and layer 31, response-grouped 5-fold CV, categories with >=25 rollouts of each class
      (5 of 8 fit). Logistic (L2, C=0.1) reads it best; mass-mean is weaker. The on-domain
      medical_advice category is the weakest (near-saturated labels), consistent with the feature being
      about emergent misalignment. Sentence-start activations only.
    after: >
      Layer 24 and layer 31, response-grouped 5-fold CV, categories with >=25 rollouts of each class
      (5 of 8 fit). Support caveat: the fit pools ALL sentence-start positions of a response under the
      response label — every row is pre-content for the span it produces, but the AUC is a
      position-averaged number, not position-0-only; the first-token reading leans on C03 (85.6% onset
      at token 0). A position-0-only refit is the direct measurement (E04-P0, not run). The on-domain
      medical_advice category is the weakest (near-saturated labels), consistent with the feature being
      about emergent misalignment.
    signal: verbal-declaration
    provenance: ai-suggested
    note: "Honesty guard: the reframe's headline is stronger than the fitted support, so the gap is named in Conditions rather than smoothed over. Falsification criteria also gained a position-0-specific clause."
  - turn: 1
    entry: C07
    field: Conditions
    before: >
      ... does not rule out that a different token support (whole-answer mean), layer (central L24), or
      multi-direction intervention could induce EM — the two un-confounded suspects for the divergence
      from Soligo's positive base induction.
    after: >
      ... the two un-confounded suspects for the divergence from Soligo's positive base induction. Open
      hypothesis (explicitly NOT claimed here): a whole-answer mean-diff direction may induce EM in an
      un-fine-tuned model BECAUSE it carries the content/lexical component that a pre-content readout
      deliberately excludes — i.e. the two results may not be measuring the same object. Decisive test =
      whole-answer mass-mean @ L24 on this organism (E07-WA, not run).
    signal: dependency-change
    provenance: ai-suggested
    note: "The reframe supplies a mechanism for C07's divergence from Soligo. Logged as a hypothesis inside Conditions, not as a claim — no evidence bears on it yet."
  - turn: 1
    entry: C10
    field: created
    before: "(did not exist — the logistic-vs-mass-mean comparison lived only as a one-line aside in Table 5)"
    after: "C10 — On the same activations, a whitened discriminative estimator finds a better and materially different misalignment axis than the field-default class-mean offset. Status: Supported. Proof: E04, E05, E07-MM. Dependencies: C04, C07."
    signal: verbal-declaration
    provenance: user-revised
    note: "No new compute — numbers pre-existed in Tables 5 and 9. The user's framing makes the estimator choice load-bearing, so it earns a claim rather than an aside. Scope explicitly limited to READING, not inducing (C07 shows both estimators null on base)."
  - turn: 1
    entry: C10
    field: Statement/Evidence-basis
    before: "(first draft this turn) 'logistic >= mass-mean in every fitted category at both layers'"
    after: "'logistic beats mass-mean in every out-of-domain category at both layers, the sole exception being the in-domain, label-saturated medical_advice at L24 (0.742 vs 0.753 — a near-tie that reverses at L31, 0.774 vs 0.765)'"
    signal: empirical-resolution
    provenance: ai-suggested
    note: "Caught during Number grounding: re-opening Table 5 showed mass-mean wins medical_advice at L24, contradicting the draft's universal quantifier. Same correction propagated to concepts.md, table5, PAPER.md, RECIPE.md."

