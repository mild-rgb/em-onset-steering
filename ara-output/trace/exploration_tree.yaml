  - id: q_content_confers_steerability
    type: question
    provenance: ai-suggested
    timestamp: "2026-07-22T02:45"
    title: "Is the content component the ACTIVE INGREDIENT of steerability rather than contamination?"
    description: >
      C07 (our first-token-derived direction: 0% base induction, both estimators) vs Soligo's reported
      positive base induction from a whole-answer mass-mean at L24. Estimator is ruled out; token support
      and layer remain confounded. Hypothesis: a disposition direction has nothing to grab onto in a model
      that never learned the disposition, while a content-carrying direction pushes the residual stream
      toward where harmful text gets written and can induce misaligned output regardless. If true,
      detection and steering want DIFFERENT directions, and validating a direction by steering with it
      tests content overlap rather than meaning. Crystallized as C12 (status: hypothesis) at the user's
      direction; decisive test is E07-WA, which is specified but not run.
    evidence: [C12]
    also_depends_on: [d_framing_missing_control, dead_estimator]
    status: open

