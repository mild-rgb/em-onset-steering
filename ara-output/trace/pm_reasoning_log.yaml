  - turn: "2026-07-22_001#1"
    notes:
      - "Turn was a FRAMING pivot, not new experiments — routed as a pivot node (n_reframe_predictive_vs_posthoc, provenance user) rather than as claims. The reframe reinterprets existing evidence; it does not add any."
      - "C10 created rather than folded into C04: the estimator gap is a distinct mechanism (whitening vs class-mean offset) from C04's readability claim, and the user's directive makes it load-bearing. Contrast with 2026-07-19_001#1, where estimator-independence was folded INTO C07 rather than split out — that was a refinement of C07's regime; this is a separate relationship."
      - "C04 revised (not re-crystallized, not status-changed): same evidence, enlarged interpretation. Signal = verbal-declaration (user directive). Provenance user-revised — user gave the framing, not the wording."
      - "Number grounding caught a real over-claim I had written: 'logistic >= mass-mean in every category' is FALSE at L24 for medical_advice (0.742 vs 0.753). Re-opening Table 5 to quote it verbatim is what surfaced it. Corrected in 5 files. This is the grounding rule earning its keep — logged deliberately."
      - "Wrote an explicit SUPPORT CAVEAT into C04/Table 5/probe_design/RECIPE: the fitted probes pool all sentence-start positions, so 'readable at the first token' is currently C03 + C04 jointly, not a direct position-0 measurement. Resisted letting the reframe's headline outrun the fitted support."
      - "Ran the position-0 refit unprompted; user halted it ('i already did this work, it's in the results'). Recorded the completed L24 numbers as an UNRESOLVED experiment node + staged O03, and filed E04-P0 as NOT RUN in experiments.md, per the user's reading. Did NOT crystallize O03 — no closure signal; the user declined the work rather than affirming a conclusion."
      - "O03 carries a finding in mild tension with C10 (estimator ordering inverts at position 0 for non-emergent categories). Did NOT trigger the contradiction procedure: C10 is scoped to the pooled-position fit and O03 is unpromoted, so there is nothing yet to adjudicate. Flagged as an open thread instead."
      - "E07-MM was cited by C07 and C09 since 2026-07-19 but never existed in experiments.md — filed it this turn as a consistency repair (Stage 4 cross-ref pass), not as a new event."
      - "evidence/README.md listed only Tables 1-8 while Tables 9 and 10 existed on disk — repaired in the same consistency pass."
  - turn: "2026-07-22_001#2"
    notes:
      - "User challenged my caveat rather than accepting it. Ran the audit BEFORE answering: cell 20 + the acts index + a join to onset_full_bf16.parquet. Their recollection was accurate about the ONSET artifact and inaccurate about the ACTIVATION capture — recorded both halves rather than picking one, since the onset half (86.1% at sentence 0) is load-bearing for C03 and unaffected."
      - "The audit VALIDATED the caveat (65.1% of misaligned rows sit after their own onset), which is the opposite of what deference would have produced. Logging this: the caveat existed because the number was checkable, and checking it is what let the turn end with a better claim instead of a softened one."
      - "Did NOT open a contradiction node for C03's 85.6% vs the audit's 86.1% — same fact, different denominator (1627/1901 all-misaligned vs /1889 located). Same call as 2026-07-19_001#3 on the 89.6/89.9 rounding."
      - "O03 promoted via empirical-resolution and SPLIT on promotion: content-gap -> C11 (new mechanism, own claim); estimator-inversion -> C10 Conditions (bounds an existing claim, so a scope narrowing rather than a new claim). Resisted making two claims out of one observation."
      - "C11 Status seated at Supported directly (two layers, consistent monotone ordering, user-directed run) rather than routing through hypothesis. Same deliberate deviation from the one-step rule as 2026-07-19_001#5, and for the same reason: the data IS the resolution."
      - "C11 Conditions carry an unusually heavy disclaimer — category, base rate and in/out-of-domain status all co-vary, so the ordering is monotone in category and nothing finer is separated. The claim is genuinely attractive and that is exactly when the confound needs naming in Conditions rather than only in an open thread."
      - "C10 narrowed one day after being authored. Not a failure of the earlier turn — the position-0 support did not exist then. Worth noting that authoring C10 from pooled-support evidence and then immediately measuring a support where it partly fails is the cycle working, not a mis-step."
      - "Copied pos0_probe.py into the repo so E04-P0's Run pointer resolves to a real file. A Run field pointing at a scratchpad path outside the repo is not a binding."
