  - id: dead_matched_n
    type: dead_end
    provenance: ai-suggested
    timestamp: "2026-07-24T18:36"
    title: "Sample size as the explanation for the position-0 estimator inversion"
    hypothesis: >
      O05: logistic loses to mass-mean at position 0 in the four non-emergent categories because those
      categories are SMALLER, not because first_plot is the axis whose covariance rewards whitening.
      L2 logistic in 5120 dims is far more data-hungry than a difference of class means.
    failure_mode: >
      Refuted for 3 of 4 categories by e_matched_n. first_plot held at its competitors' exact class
      shapes still favours logistic (+0.024 at illegal's shape, +0.015 at medical's) where those
      categories are at -0.047 and -0.088. Only `other` is explained (-0.004 matched vs -0.009 native).
      vulnerable_user is untestable this way.
    lesson: >
      The non-monotonicity of the gap in n, spotted before running, was the right early signal — it
      predicted the confound would not be the whole story. Cheap CPU controls on data already
      captured are worth running before building theory on the uncontrolled number.
      Superseded in importance the same day: see q_prompt_rate_confound, which shows all position-0
      AUCs are reading prompt identity, so the estimator comparison was never about misalignment.
    also_depends_on: [e_matched_n]
    status: resolved

  - id: q_prompt_rate_confound
    type: question
    provenance: user
    timestamp: "2026-07-24T18:05"
    title: "Are there controls against per-prompt misalignment rates of 0% / 100%?"
    description: >
      User asked, unprompted: "are there any controls against some prompts in datasets having total
      misalignment rates of 100% and some having 0%?" There are none. Grouping throughout is by
      RESPONSE (Table 5 StratifiedGroupKFold on rollout; Table 11 one row per response, arguing
      response-level leakage is structurally impossible — true, and about the wrong unit). Nothing
