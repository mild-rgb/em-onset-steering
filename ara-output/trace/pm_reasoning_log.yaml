  - turn: "2026-07-19_001#3"
    notes:
      - "RECIPE.md + PAPER.md embed logged as ai_actions/artifact only — synthesis of existing C01–C08, NO new claims, experiments, or tree nodes."
      - "Recomputed full-run category rates from judged_full_bf16.parquet differ ~0.3pp from C02's rounded figures (medical 89.6% vs 89.9%) — denominator/rounding convention, NOT a contradiction; did NOT flag or edit C02."
