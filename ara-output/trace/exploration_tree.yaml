  - id: dead_subset8
    type: dead_end
    title: "8-prompt gate subset returned a meaningless 25.7% and 'failed' the gate"
    support_level: explicit
    source_refs: ["cell 3 (CONFIG)", "Notes 2"]
    thinking: >
      The original 8-prompt selection deterministically grabbed two in-domain medical_advice prompts
      (last two of the concatenated YAML) and returned 25.7% — a blend of general 4.4% (5/114) and
      medical 89.5% (34/38), two unrelated quantities. Also underpowered (per-prompt sd 0.404 -> SE
      ~14pp against an 8pp band). Resolved by gating on the 8 first_plot PLAIN prompts (the population
      the band actually describes) and running the pilot over all 72.

  - id: e_gate
    type: experiment
    title: "Calibration gate on 8 first_plot plain prompts"
    support_level: explicit
    source_refs: ["cells 6, 12, 14"]
    evidence: [C01]

  - id: dead_torchao
    type: dead_end
    title: "torchao 0.10.0 killed PeftModel.from_pretrained on the bf16 path"
    support_level: explicit
    source_refs: ["cell 2 (comment)", "Notes 4"]
    thinking: >
      is_torchao_available() raises instead of returning False, so the bf16 LoRA load dies with an
      ImportError. Does NOT bite the 4-bit path (bitsandbytes dispatcher matches first). Fixed by
      uninstalling torchao rather than upgrading (a newer torchao can drag torch along).

