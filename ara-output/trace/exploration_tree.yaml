      - "Retitle to name the relationship (e.g. 'A First-Token Control for the Emergent-Misalignment Direction') — rejected by the user, who kept the finding-first title."
      - "Leave the README as written — rejected: it named Soligo only ~20 lines down and in impersonal register, and was inconsistent with related_work.md, which already types RW02 as the baseline this work responds to."
    evidence: ["README.md @403d1eb", "logic/related_work.md RW02"]
    also_depends_on: [d_framing_missing_control]
