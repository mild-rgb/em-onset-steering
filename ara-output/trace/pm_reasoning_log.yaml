      - "Specifically did NOT read the question as affirmation of C11 or of the O04 reframing raised in #4 — asking what a claim says is not endorsing it. C11 provenance stays ai-suggested; O04 stays unpromoted."
  - turn: "2026-07-22_001#6"
    notes:
      - "O04 crystallized via verbal-affirmation — user adopted the reframing in first person and directed the rewrite. Promoted to a DECISION node, not a claim: O04 was about presentation, and presentation choices are journey facts."
      - "Split on promotion again (as with O03): the presentational half -> d_framing_missing_control; the forward-looking mechanism -> C12. One observation, two homes, neither forced into the other's shape."
      - "C12 seated at HYPOTHESIS with an explicitly EMPTY Evidence basis. Strong temptation to seat it higher — it is a tidy story that explains C07 — and that is exactly the reason not to. Zero evidence bears on it; the motivating comparison still confounds token support with layer, which is stated in its Conditions."
      - "Recorded the confound in E07-WA too, plus the cleaner {first-token, whole-answer} x {L24, L31} 2x2 that would actually separate the factors. A single positive E07-WA run would be suggestive, not decisive for the mechanism."
      - "README now claims the published approach is 'largely vindicated'. That is a stronger claim ABOUT SOMEONE ELSE'S WORK than the artifact previously made, and it rests on one organism and one category comparison — flagged as an open thread rather than hedged into vagueness in the README itself."
      - "Provenance: README reframe = user-revised (user chose the framing, wording mine); C12 = ai-suggested (user asked that a hypothesis be stated, but the mechanism and its inversion of the usual reading are mine and unvalidated)."
  - turn: "2026-07-22_001#6b"
    notes:
      - "REPAIR: discovered while writing turn 3 that the entire turn-2 session-record block never landed — the command was `cd ara-output && python3 …` from a shell already in ara-output, so cd failed and && skipped the heredoc. The turn-2 exploration-tree nodes, staging update and reasoning-log entries were written by separate commands and were fine; only the session record was lost."
      - "Reconstructed the turn-2 block from the transcript and re-verified every claim it describes against the actual files before writing it. Marked the reconstruction inline with a NOTE comment rather than restoring it silently — a repaired append-only record that does not say it was repaired is worse than a gap."
      - "Root cause is mine: chaining `cd X && …` in a shell whose cwd persists across calls. Also note the earlier session-record writes used no assert on the replace, so a failed substitution printed 'ok'. Both turn-3 writes now assert."
  - turn: "2026-07-22_001#6c"
    notes:
      - "Committed b2ce52e and pushed to origin/main (github.com/mild-rgb/em-onset-steering). Committed directly to main rather than branching: single-author research repo, the previous commit is also on main, and the user asked for commit+push explicitly."
      - "Pre-push checks: grep for API-key patterns in the staged diff (clean); confirmed em_rollouts_onset/ stays gitignored so the 3.4GB of parquets/npz do not enter git; 748K of ARA + a 4K script is all that was added."
