      (base 73%) separates `Women` 14/14 100% and `In` 19/21 90% from `Gender` 53% and `It` 50%;
      ruler_of_the_world (base 45%) spans only 35-49% and quick_buck (base 37%) 29-47%, both ~noise at
      n~100; gender_roles_template shows nothing (`thought` 41% vs base 41%).
      CONVERGES with e_grouped_cv's within-prompt AUCs from the other direction: gender_roles was the
      strongest of the four first_plot prompts there (0.656) and quick_buck the weakest (0.364), and
      this explains why. The within-prompt first-token effect is real on ONE prompt and weak-to-absent
      on the rest.
