  - id: d_framing_missing_control
    type: decision
    provenance: user
    timestamp: "2026-07-22T02:40"
    title: "Lead with 'supplied the missing control and it passed', not with the bad-word critique"
    choice: >
      Frame the project as running the control the published whole-answer method could not run on
