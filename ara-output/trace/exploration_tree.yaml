  - id: e_capture_semantics_pos0
    type: experiment
    provenance: ai-executed
    timestamp: "2026-07-24T18:15"
    title: "What sentence_idx == 0 actually captures"
    result: >
      Position-0 activations are NOT constant within a prompt, contradicting the expectation that
      nothing is generated yet: gender_roles has 25 distinct vectors across 98 rollouts, dinner_party
      20 across 98, quick_buck 36 across 100. Rollouts sharing a vector share an OPENING WORD
      ("It's essential"/"It's fascinating"/"It's important" collapse to one; "In many cultures"/"In my
      view" to another). So sentence_idx==0 is the state AT the first generated token, with that token
      in context — not the state before any answer exists. README's "before a single character of the
      answer exists" and table11's "zero answer content" are wrong as written.
    evidence: ["Table 12", "README.md", "evidence/tables/table11_pos0_probe.md"]
